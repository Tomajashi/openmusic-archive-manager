services:
  openmusic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openmusic-archive-manager
    restart: unless-stopped
    ports:
      - "${OPENMUSIC_PORT:-8080}:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONFIG_DIR=/app/config
      - DOWNLOAD_DIR=/downloads
      - MUSIC_DIR=/music
      - DATABASE_URL=${DATABASE_URL:-}
      - SEARCH_CONCURRENCY=${SEARCH_CONCURRENCY:-5}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-3}
      - MAX_STORAGE_GB=${MAX_STORAGE_GB:-500}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID:-}
      - MUSOPEN_API_KEY=${MUSOPEN_API_KEY:-}
      - PIRATEBAY_ENABLED=${PIRATEBAY_ENABLED:-true}
      - PIRATEBAY_API_URL=${PIRATEBAY_API_URL:-https://apibay.org}
      - QBITTORRENT_URL=${QBITTORRENT_URL:-}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD:-}
      - NAVIDROME_ENABLED=${NAVIDROME_ENABLED:-false}
      - NAVIDROME_URL=${NAVIDROME_URL:-http://navidrome:4533}
      - NAVIDROME_USER=${NAVIDROME_USER:-}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:-}
      - NAVIDROME_MUSIC_PATH=/music
    volumes:
      - ./config:/app/config
      - ./downloads:/downloads
      - ${MUSIC_HOST_PATH:-./music}:/music
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  navidrome:
    image: deluan/navidrome:latest
    container_name: openmusic-navidrome
    profiles: ["with-navidrome"]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_MUSICFOLDER: /music
    volumes:
      - ./config/navidrome:/data
      - ${MUSIC_HOST_PATH:-./music}:/music:ro
